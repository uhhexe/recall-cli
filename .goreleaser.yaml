version: 2
project_name: recall
changelog:
  disable: true
builds:
  - id: recall
    main: ./cmd/recall
    binary: recall
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X recall/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
